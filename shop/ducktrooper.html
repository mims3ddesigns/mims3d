  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif;

      color: var(--text-dark); 
      line-height: 1.7;
    }

    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: var(--accent);
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: #000;
    }
    .nav-links a {
      color: #000;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.95rem;
      margin-left: 2rem;
    }
    .nav-links a:hover, .nav-links a.active { color: #fff; }

    .cart-icon { font-size: 1.6rem; text-decoration: none; color: #000; }

    main {
      padding-top: 140px;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 5%;

    h1 { font-family: 'Playfair Display', serif; font-size: 3.2rem; text-align: center; }
    .price { font-size: 2rem; color: var(--accent); text-align: center; margin: 1rem 0; }

    img {
      max-width: 520px;
      width: 100%;
      border-radius: 12px;
      display: block;
      margin: 2rem auto;
    }

    form {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid #E2E8E0;
    }
    label { display: block; margin: 1.2rem 0 0.4rem; font-weight: 600; }
    .required::after { content: " *"; color: red; }
    input, select, textarea {
      width: 100%;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 1.3rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">HOME</a>
        <a href="../services.html">SERVICES</a>
        <a href="../shop.html">SHOP</a>

      <a href="../cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
    </nav>
  </header>

  <main>
    <h1>DuckTrooper</h1>
    <p class="price">$8.00</p>

    <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">

    <form id="orderForm" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="47582191-429a-495c-9f10-6b62f050a1e0">
      <input type="hidden" name="subject" value="New DuckTrooper Order">

      <label class="required">Duck Body Color</label>
      <select name="color" required>
        <option value="">Choose Color</option>
        <option value="Yellow">Yellow</option>
        <option value="White">White</option>
        <option value="Red">Red</option>
        <option value="Black">Black</option>
        <option value="Green">Green</option>
        <option value="Orange">Orange</option>
        <option value="Purple">Purple</option>
      </select>

      <label class="required">Quantity</label>
      <input type="number" name="quantity" value="1" min="1" required>

      <label class="required">Full Name</label>
      <input type="text" name="name" required>

      <label class="required">Email</label>
      <input type="email" name="email" required>

      <label class="required">Phone</label>
      <input type="tel" name="phone" required>

      <label class="required">Street Address</label>
      <input type="text" name="street" required>

      <label>Apartment / Suite / Unit (optional)</label>
      <input type="text" name="apt">

      <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap:1rem;">
        <div><label class="required">City</label><input type="text" name="city" required></div>
        <div><label class="required">State</label><input type="text" name="state" required></div>
        <div><label class="required">ZIP Code</label><input type="text" name="zip" required></div>
      </div>

      <label>Order Notes (optional)</label>
      <textarea name="notes" rows="4"></textarea>

      <button type="submit">Submit Order & Pay with PayPal</button>
    </form>
  </main>

  <script>
    const form = document.getElementById('orderForm');

    form.addEventListener('submit', function(e) {
      // Let Web3Forms send the email first
      // Then open PayPal
      setTimeout(() => {
        window.open('https://paypal.me/MimsSolutions/8', '_blank');
      }, 800); // Small delay so the form can submit
    });

    // Mobile menu (simple version)

  </script>
