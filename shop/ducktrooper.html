<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18035820566"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'AW-18035820566');

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DuckTrooper Figurine • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
      --accent-dark: #0B7A70;
      --card-bg: #FFFFFF;
      --border: #E2E8E0;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg-light); 
      color: var(--text-dark); 
      line-height: 1.6;
    }

    /* ===== EXACT HEADER FROM YOUR INDEX ===== */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: var(--accent);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: #000;
      letter-spacing: -1.2px;
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
    }
    .nav-links a {
      color: #000;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: #fff;
    }
    .menu-toggle {
      display: none;
      font-size: 2rem;
      cursor: pointer;
      color: #000;
    }
    /* ========================================= */

    .product-hero {
      padding: 110px 5% 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    .product-images {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .main-image img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .thumbnails img {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      opacity: 0.85;
    }
    .thumbnails img:hover { opacity: 1; }

    .product-info {
      background: white;
      padding: 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-top: 2rem;
    }

    .price { font-size: 2.1rem; font-weight: 700; color: var(--accent); margin: 1rem 0; }

    select, input, textarea {
      width: 100%;
      padding: 1rem;
      margin: 0.8rem 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    .btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
    }

    @media (max-width: 768px) {
      .nav-links {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 70%;
        background: #1a3c2e;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transform: translateX(100%);
        transition: transform 0.4s ease;
        z-index: 999;
      }
      .nav-links.show { transform: translateX(0); }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">HOME</a>
        <a href="../services.html">SERVICES</a>
        <a href="../shop.html">SHOP</a>
        <a href="../about.html">ABOUT</a>
        <a href="../contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="product-hero">
    <a href="../shop.html" class="back-btn">← Back to Shop</a>
    
    <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem;">DuckTrooper Figurine</h1>
    <p class="price">$45</p>

    <!-- Rest of your content here -->
    <div class="product-images">
      <div class="main-image">
        <img id="mainImg" src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">
      </div>
      <div class="thumbnails">
        <img src="https://i.etsystatic.com/56737607/r/il/8b05bf/6839544850/il_fullxfull.6839544850_1rce.jpg" onclick="document.getElementById('mainImg').src=this.src">
        <img src="https://i.etsystatic.com/56737607/r/il/3c5c13/6786178990/il_fullxfull.6786178990_tq6h.jpg" onclick="document.getElementById('mainImg').src=this.src">
      </div>
    </div>

    <div class="product-info">
      <h2>Description</h2>
      <p>Star Wars meets Rubber Duck! A fun and detailed collectible figure.</p>

      <label>Duck Body Color</label>
      <select id="color">
        <option>Yellow</option>
        <option>White</option>
        <option>Black</option>
        <option>Orange</option>
        <option>Red</option>
        <option>Purple</option>
      </select>

      <label>Quantity</label>
      <input type="number" id="qty" value="1" min="1">

      <label>Special Requests / Notes</label>
      <textarea id="notes" rows="4" placeholder="Shipping info or custom requests..."></textarea>

      <button onclick="buyNow()" class="btn">Buy with PayPal - $45</button>
    </div>
  </div>

  <script>
    function buyNow() {
      const color = document.getElementById('color').value;
      const qty = document.getElementById('qty').value;
      
      if (confirm(`Order Summary:\nDuckTrooper Figurine\nColor: ${color}\nQty: ${qty}\n\nContinue to PayPal?`)) {
        window.location.href = "https://paypal.me/MimsSolutions/45";
      }
    }

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });
  </script>
</body>
</html>
