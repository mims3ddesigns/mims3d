<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DuckTrooper Figurine • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
      --accent-dark: #0B7A70;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); }

    /* Header - Exact match to your site */
    header { position: fixed; top: 0; width: 100%; background: var(--accent); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; letter-spacing: -1.2px; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { color: #000; font-weight: 600; text-decoration: none; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .menu-toggle { display: none; font-size: 2rem; cursor: pointer; color: #000; }

    .product-hero { padding: 110px 5% 60px; max-width: 1100px; margin: 0 auto; }
    .back-btn { color: var(--accent); text-decoration: none; font-weight: 600; margin-bottom: 1rem; display: inline-block; }

    .product-info {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid #E2E8E0;
      margin-top: 2rem;
    }

    label { display: block; margin: 1.2rem 0 0.5rem; font-weight: 600; }
    select, input, textarea { width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }

    .btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1.5rem;
    }

    @media (max-width: 768px) {
      .nav-links { position: fixed; top:0; right:0; bottom:0; width:70%; background:#1a3c2e; flex-direction:column; justify-content:center; align-items:center; transform:translateX(100%); transition:0.4s; z-index:999; }
      .nav-links.show { transform: translateX(0); }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">HOME</a>
        <a href="../services.html">SERVICES</a>
        <a href="../shop.html">SHOP</a>
        <a href="../about.html">ABOUT</a>
        <a href="../contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="product-hero">
    <a href="../shop.html" class="back-btn">← Back to Shop</a>
    
    <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem;">DuckTrooper Figurine</h1>
    <p style="font-size: 2rem; font-weight: 700; color: var(--accent);">$45 each</p>

    <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" style="width:100%; max-width:700px; border-radius:16px; margin:2rem 0;" alt="DuckTrooper">

    <div class="product-info">
      <h2>Order This Item</h2>
      <p>Fill out the form below. You'll receive confirmation and then can complete payment.</p>

      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE"> <!-- We'll set this up -->
        <input type="hidden" name="subject" value="New DuckTrooper Order Request">
        <input type="hidden" name="from_name" value="Mims Solutions Shop">

        <label>Duck Body Color</label>
        <select name="color" required>
          <option value="Yellow">Yellow</option>
          <option value="White">White</option>
          <option value="Black">Black</option>
          <option value="Orange">Orange</option>
          <option value="Red">Red</option>
          <option value="Purple">Purple</option>
        </select>

        <label>Quantity</label>
        <input type="number" name="quantity" value="1" min="1" required>

        <label>Your Email (for order confirmation)</label>
        <input type="email" name="email" required placeholder="your@email.com">

        <label>Shipping Address + Notes</label>
        <textarea name="message" rows="5" placeholder="Full shipping address + any special requests..." required></textarea>

        <button type="submit" class="btn">Submit Order Request</button>
      </form>
    </div>
  </div>

  <script>
    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });
  </script>
</body>
</html>
