<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18035820566"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18035820566');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DuckTrooper Figurine • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

    header { 
      position: fixed; top: 0; width: 100%; background: var(--accent); 
      z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
    }
    nav { 
      max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; 
      display: flex; justify-content: space-between; align-items: center; 
    }
    .logo { 
      font-family: 'Playfair Display', serif; font-size: 2.25rem; 
      font-weight: 700; color: #000; letter-spacing: -1.2px; 
    }
    .nav-links a { 
      color: #000; font-weight: 600; text-decoration: none; 
      text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; 
      margin-left: 2rem; 
    }
    .nav-links a:hover { color: #fff; }

    .cart-icon {
      display: flex; align-items: center; gap: 6px; 
      text-decoration: none; color: #000; font-weight: 600; font-size: 1.1rem;
    }

    .product-hero { padding: 110px 5% 60px; max-width: 1100px; margin: 0 auto; }
    .back-btn { color: var(--accent); font-weight: 600; text-decoration: none; margin-bottom: 1rem; display: inline-block; }

    .product-info {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid #E2E8E0;
      margin-top: 2rem;
    }

    label { display: block; margin: 1.2rem 0 0.5rem; font-weight: 600; }
    select, input, textarea { width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }

    .btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1.5rem;
    }

    .shipping-note {
      background: #f0f9ff;
      padding: 1rem;
      border-radius: 12px;
      margin: 1.5rem 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">HOME</a>
        <a href="../services.html">SERVICES</a>
        <a href="../shop.html">SHOP</a>
        <a href="../about.html">ABOUT</a>
        <a href="../contact.html">CONTACT</a>
      </div>
      
      <a href="../cart.html" class="cart-icon">
        🛒 <span id="cart-count">0</span>
      </a>

      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="product-hero">
    <a href="../shop.html" class="back-btn">← Back to Shop</a>
    
    <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem;">DuckTrooper Figurine</h1>
    <p style="font-size: 2rem; font-weight: 700; color: var(--accent);">$8 each</p>

    <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" 
     style="width:100%; max-width:520px; border-radius:16px; margin:2rem 0;" alt="DuckTrooper">

    <div class="product-info">
      <h2>Add to Cart</h2>

      <label>Duck Body Color</label>
      <select id="color">
        <option value="Yellow">Yellow</option>
        <option value="White">White</option>
        <option value="Black">Black</option>
        <option value="Orange">Orange</option>
        <option value="Red">Red</option>
        <option value="Purple">Purple</option>
      </select>

      <label>Quantity</label>
      <input type="number" id="quantity" value="1" min="1">

      <label>Special Requests / Gift Message</label>
      <textarea id="notes" rows="3" placeholder="Any special requests..."></textarea>

      <div class="shipping-note">
        <strong>Shipping:</strong> $7 flat rate (US only)
      </div>

      <button onclick="addToCart()" class="btn">Add to Cart - $8</button>
    </div>
  </div>

  <script>
    function addToCart() {
      const color = document.getElementById('color').value;
      const quantity = parseInt(document.getElementById('quantity').value);
      const notes = document.getElementById('notes').value;

      const item = {
        id: Date.now(),
        name: "DuckTrooper Figurine",
        price: 8,
        quantity: quantity,
        color: color,
        notes: notes
      };

      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.push(item);
      localStorage.setItem('cart', JSON.stringify(cart));

      alert(`✅ Added ${quantity}x DuckTrooper (${color}) to cart!`);
      updateCartCount();
    }

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const countEl = document.getElementById('cart-count');
      if (countEl) countEl.textContent = cart.length;
    }

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });

    window.onload = updateCartCount;
  </script>
</body>
</html>
