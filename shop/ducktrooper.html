<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18035820566"></script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DuckTrooper • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg-light); 
      color: var(--text-dark); 
      line-height: 1.7;
    }

    /* Header - Exact match to About.html */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: var(--accent);
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: #000;
      letter-spacing: -1.2px;
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
    }
    .nav-links a {
      color: #000;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: #fff;
    }

    .cart-icon {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #000;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .menu-toggle {
      display: none;
      font-size: 2rem;
      cursor: pointer;
      color: #000;
    }

    main {
      padding-top: 140px;
      max-width: 1000px;
      margin: 0 auto;
      padding-left: 5%;
      padding-right: 5%;
      padding-bottom: 6rem;
    }

    .product-hero {
      text-align: center;
      margin-bottom: 3rem;
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3rem, 7vw, 5rem);
      margin-bottom: 1rem;
    }
    .price {
      font-size: 2rem;
      color: var(--accent);
      font-weight: 700;
    }
    img {
      max-width: 520px;
      width: 100%;
      border-radius: 12px;
      margin: 2rem auto;
      display: block;
      box-shadow: 0 15px 35px rgba(0,0,0,0.15);
    }

    form {
      background: white;
      padding: 2.5rem;
      border-radius: 16px;
      border: 1px solid #E2E8E0;
      margin-top: 2rem;
    }
    label { display: block; margin: 1.2rem 0 0.4rem; font-weight: 600; }
    input, select, textarea {
      width: 100%;
      padding: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    button {
      width: 100%;
      padding: 1.2rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      margin-top: 2rem;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav-links {
        position: fixed;
        top: 0; right: 0; bottom: 0;
        width: 70%;
        background: #1a3c2e;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transform: translateX(100%);
        transition: transform 0.4s ease;
        z-index: 999;
      }
      .nav-links.show { transform: translateX(0); }
      .menu-toggle { display: block; }
      main { padding-top: 120px; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">HOME</a>
        <a href="../services.html">SERVICES</a>
        <a href="../shop.html">SHOP</a>
        <a href="../about.html">ABOUT</a>
        <a href="../contact.html">CONTACT</a>
      </div>
      
      <a href="../cart.html" class="cart-icon">
        🛒 <span id="cart-count">0</span>
      </a>

      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <main>
    <div class="product-hero">
      <h1>DuckTrooper</h1>
      <p class="price">$8.00</p>
    </div>

    <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" 
         alt="DuckTrooper Figurine">

    <form action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="47582191-429a-495c-9f10-6b62f050a1e0">
      <input type="hidden" name="subject" value="New DuckTrooper Order">

      <label>Color</label>
      <select name="color" required>
        <option value="">Select Color</option>
        <option value="Yellow">Yellow</option>
        <option value="White">White</option>
        <option value="Red">Red</option>
        <option value="Black">Black</option>
        <option value="Green">Green</option>
        <option value="Orange">Orange</option>
        <option value="Purple">Purple</option>
      </select>

      <label>Quantity</label>
      <input type="number" name="quantity" value="1" min="1" required>

      <label>Your Name</label>
      <input type="text" name="name" required>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone</label>
      <input type="tel" name="phone">

      <label>Shipping Address</label>
      <textarea name="address" rows="3" placeholder="Street, City, State, ZIP" required></textarea>

      <label>Order Notes (optional)</label>
      <textarea name="notes" rows="3"></textarea>

      <button type="submit">Submit Order • Pay with PayPal</button>
    </form>
  </main>

  <script>
    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const countEl = document.getElementById('cart-count');
      if (countEl) countEl.textContent = cart.length;
    }
    window.onload = updateCartCount;
  </script>
</body>
</html>
