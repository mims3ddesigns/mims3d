  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DuckTrooper • Mims Solutions</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
 
  <style>
    :root { --accent: #0D9488; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #F8F9F6; 
      color: #1F2521; 
      line-height: 1.7;
      margin: 0;
    }

    header { 
      position: fixed; 
      top: 0; 
      width: 100%; 
      background: var(--accent); 
      z-index: 1000; 
      box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
    }

    nav { 
      max-width: 1400px; 
      margin: 0 auto; 
      padding: 1.2rem 5%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }

    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { color: #000; font-weight: 600; text-decoration: none; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }

    .cart-icon { font-size: 1.6rem; text-decoration: none; color: #000; }
    .menu-toggle { display: none; font-size: 2rem; cursor: pointer; color: #000; }

    main { 
      padding-top: 250px !important;   /* Stronger padding */
      max-width: 900px; 
      margin: 0 auto; 
      padding: 0 5%; 
    }

    h1 { 
      font-family: 'Playfair Display', serif; 
      font-size: 3.2rem; 
      text-align: center; 
      margin-bottom: 0.5rem;
    }
    .price { 
      font-size: 2rem; 
      color: var(--accent); 
      text-align: center; 
      margin-bottom: 2rem; 
    }

    /* Carousel - Keeping the style you liked */
    .carousel {
      position: relative;
      max-width: 420px;
      margin: 2rem auto;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .carousel img {
      width: 100%;
      height: auto;
      display: block;
      transition: opacity 0.4s;
    }
    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      width: 45px;
      height: 45px;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .prev { left: 10px; }
    .next { right: 10px; }

    form { background: white; padding: 2.5rem; border-radius: 16px; border: 1px solid #E2E8E0; margin-top: 2rem; }
