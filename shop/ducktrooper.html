<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag -->
<script async src="https://www.googletagmanager.com/gtag/js?id=AW-18035820566"></script>
<script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DuckTrooper Figurine • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
      --card-bg: #FFFFFF;
      --border: #E2E8E0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

    header { 
      position: fixed; top: 0; width: 100%; background: var(--accent); 
      z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
    }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }

    .product-hero {
      padding: 110px 5% 60px;
      text-align: center;
      max-width: 1200px;
      margin: 0 auto;
    }

    .product-images {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      margin: 2rem 0;
    }

    .main-image img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .thumbnails {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .thumbnails img {
      width: 100%;
      border-radius: 12px;
      cursor: pointer;
      opacity: 0.8;
    }
    .thumbnails img:hover { opacity: 1; }

    .product-info {
      background: white;
      padding: 2rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      margin-top: 2rem;
    }

    .price {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin: 1rem 0;
    }

    select, input, textarea {
      width: 100%;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1rem;
    }

    .back-btn {
      display: inline-block;
      margin: 2rem 0;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">HOME</a>
        <a href="../services.html">SERVICES</a>
        <a href="../shop.html">SHOP</a>
        <a href="../about.html">ABOUT</a>
        <a href="../contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="product-hero">
    <a href="../shop.html" class="back-btn">← Back to Shop</a>
    
    <h1 style="font-family: 'Playfair Display', serif; font-size: 3.2rem;">DuckTrooper Figurine</h1>
    <p class="price">$45</p>

    <div class="product-images">
      <div class="main-image">
        <img id="mainImg" src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">
      </div>
      <div class="thumbnails">
        <!-- Add more images here -->
        <img src="https://i.etsystatic.com/56737607/r/il/8b05bf/6839544850/il_fullxfull.6839544850_1rce.jpg" onclick="document.getElementById('mainImg').src=this.src">
        <img src="https://i.etsystatic.com/56737607/r/il/3c5c13/6786178990/il_fullxfull.6786178990_tq6h.jpg" onclick="document.getElementById('mainImg').src=this.src">
      </div>
    </div>

    <div class="product-info">
      <h2>Description</h2>
      <p>Star Wars meets Rubber Duck! Fun collectible figure perfect for desks, bathrooms, or Jeep dashboards.</p>

      <label>Duck Body Color</label>
      <select id="color">
        <option>Yellow</option>
        <option>White</option>
        <option>Black</option>
        <option>Orange</option>
        <option>Red</option>
        <option>Purple</option>
      </select>

      <label>Quantity</label>
      <input type="number" id="qty" value="1" min="1">

      <label>Special Requests / Notes</label>
      <textarea id="notes" rows="4" placeholder="Shipping address or custom requests..."></textarea>

      <button onclick="buyNow()" class="btn">Buy with PayPal</button>
    </div>
  </div>

  <script>
    function buyNow() {
      const color = document.getElementById('color').value;
      const qty = document.getElementById('qty').value;
      alert(`Thank you!\n\nProduct: DuckTrooper Figurine\nColor: ${color}\nQuantity: ${qty}\n\nRedirecting to PayPal...`);
      window.open('https://paypal.me/MimsSolutions/45', '_blank');
    }

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });
  </script>
</body>
</html>
