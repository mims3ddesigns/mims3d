<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); }

    /* Consistent Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background: var(--accent);
      z-index: 1000;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    nav {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.2rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 2.25rem;
      font-weight: 700;
      color: #000;
      letter-spacing: -1.2px;
    }
    .nav-links {
      display: flex;
      gap: 2.5rem;
    }
    .nav-links a {
      color: #000;
      font-weight: 600;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.95rem;
      letter-spacing: 1px;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: #fff;
    }

    /* Cart Icon */
    .cart-icon {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #000;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .shop-hero {
      padding: 110px 5% 80px;
      text-align: center;
    }

    .shop-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 5% 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.3s;
    }
    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }
    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }
    .product-info {
      padding: 1.5rem;
      text-align: center;
    }
    .price {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">HOME</a>
        <a href="services.html">SERVICES</a>
        <a href="shop.html" class="active">SHOP</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </div>
      
      <!-- Cart Icon -->
      <a href="cart.html" class="cart-icon">
        🛒 <span id="cart-count">0</span>
      </a>
    </nav>
  </header>

  <div class="shop-hero">
    <h1 style="font-family: 'Playfair Display', serif; font-size: 3.5rem;">Our Shop</h1>
    <p style="font-size: 1.4rem; color: #47555E;">High-quality 3D printed products • Made in Texas</p>
  </div>

  <div class="shop-grid">
    <div class="product-card" onclick="window.location.href='shop/ducktrooper.html'">
      <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">
      <div class="product-info">
        <h3>DuckTrooper</h3>
        <p style="color:#666;">Custom colors available</p>
        <div class="price">$8</div>
      </div>
    </div>
  </div>

  <script>
    // Update cart count
    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const countEl = document.getElementById('cart-count');
      if (countEl) countEl.textContent = cart.length;
    }

    window.onload = updateCartCount;
  </script>
</body>
</html>
