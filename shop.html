<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag -->

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop • Mims Solutions</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
      --card-bg: #FFFFFF;
      --border: #E2E8E0;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: var(--bg-light); 
      color: var(--text-dark); 
      line-height: 1.6;
    }

    header { 
      position: fixed; top: 0; width: 100%; background: var(--accent); 
      z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
    }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }

    .shop-grid {
      max-width: 1400px;
      margin: 120px auto 4rem;
      padding: 0 5%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.07);
      cursor: pointer;
      transition: all 0.3s;
    }
    .product-card:hover { transform: translateY(-8px); }

    .product-card img { width: 100%; height: 250px; object-fit: cover; }
    .product-info { padding: 1.5rem; text-align: center; }
    .price { font-size: 1.6rem; font-weight: 700; color: var(--accent); margin: 0.5rem 0; }

    /* Simple Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 420px;
      border-radius: var(--radius);
      padding: 1.5rem;
    }
    .close { float: right; font-size: 2rem; cursor: pointer; }

    label { display: block; margin: 1rem 0 0.5rem; font-weight: 600; }
    select, input, textarea { width: 100%; padding: 0.8rem; border: 1px solid #ccc; border-radius: 8px; }

    .btn {
      width: 100%;
      padding: 1rem;
      margin-top: 1.5rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">HOME</a>
        <a href="services.html">SERVICES</a>
        <a href="shop.html" class="active">SHOP</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="shop-grid">
    <div class="product-card" onclick="openModal()">
      <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">
      <div class="product-info">
        <h3>DuckTrooper Figurine</h3>
        <div class="price">$45</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">×</span>
      <h2>DuckTrooper Figurine - $45</h2>
      
      <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" style="width:100%; border-radius:12px; margin:1rem 0;" alt="">

      <label>Duck Body Color</label>
      <select id="color">
        <option>Yellow</option>
        <option>White</option>
        <option>Black</option>
        <option>Orange</option>
        <option>Red</option>
        <option>Purple</option>
      </select>

      <label>Quantity</label>
      <input type="number" id="qty" value="1" min="1">

      <label>Notes / Shipping Info</label>
      <textarea id="notes" rows="3" placeholder="Any special requests..."></textarea>

      <button onclick="submitOrder()" class="btn">Submit Request & Pay with PayPal</button>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modal').style.display = "flex";
    }

    function closeModal() {
      document.getElementById('modal').style.display = "none";
    }

    function submitOrder() {
      const color = document.getElementById('color').value;
      const qty = document.getElementById('qty').value;
      const notes = document.getElementById('notes').value;

      alert(`Order Request Received!\n\nProduct: DuckTrooper Figurine\nColor: ${color}\nQuantity: ${qty}\n\nRedirecting to PayPal...`);
      
      window.open('https://paypal.me/MimsSolutions/45', '_blank');
      closeModal();
    }

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });
  </script>
</body>
</html>
