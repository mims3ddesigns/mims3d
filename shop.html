<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root { --accent: #0D9488; }
    body { font-family: 'Inter', sans-serif; background: #F8F9F6; color: #1F2521; line-height: 1.7; }

    header { position: fixed; top: 0; width: 100%; background: var(--accent); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { color: #000; font-weight: 600; text-decoration: none; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }

    .cart-icon { font-size: 1.6rem; text-decoration: none; color: #000; }
    .menu-toggle { display: none; font-size: 2rem; cursor: pointer; color: #000; }

    .shop-hero { padding: 110px 5% 80px; text-align: center; }
    .shop-grid {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 5% 5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }
    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: 0.3s;
    }
    .product-card:hover { transform: translateY(-8px); }
    .product-card img { width: 100%; height: 260px; object-fit: cover; }
    .product-info { padding: 1.5rem; text-align: center; }
    .price { font-size: 1.6rem; font-weight: 700; color: var(--accent); }

    @media (max-width: 768px) {
      .nav-links {
        position: fixed; top: 0; right: 0; bottom: 0; width: 70%;
        background: #1a3c2e; flex-direction: column; justify-content: center; align-items: center;
        transform: translateX(100%); transition: transform 0.4s ease; z-index: 999;
      }
      .nav-links.show { transform: translateX(0); }
      .menu-toggle { display: block; }
      .shop-hero { padding-top: 100px; }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">HOME</a>
        <a href="services.html">SERVICES</a>
        <a href="shop.html" class="active">SHOP</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </div>
      <a href="cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="shop-hero">
    <h1 style="font-family: 'Playfair Display', serif; font-size: 3.5rem;">Our Shop</h1>
    <p style="font-size: 1.4rem; color: #47555E;">High-quality 3D printed products • Made in Texas</p>
  </div>

  <div class="shop-grid">
    <div class="product-card" onclick="window.location.href='shop/ducktrooper.html'">
      <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">
      <div class="product-info">
        <h3>DuckTrooper</h3>
        <p style="color:#666;">Custom colors available</p>
        <div class="price">$8</div>
      </div>
    </div>
  </div>

  <script>
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });

    function updateCartCount() {
      const cart = JSON.parse(localStorage.getItem('cart')) || [];
      const countEl = document.getElementById('cart-count');
      if (countEl) countEl.textContent = cart.length;
    }
    window.onload = updateCartCount;
  </script>
</body>
</html>
