<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18035820566"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18035820566');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #0D9488;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: 'Inter', sans-serif; 
      background: #F8F9F6; 
      color: #1F2521; 
    }

    header { 
      position: fixed; top: 0; width: 100%; background: var(--accent); 
      z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); 
    }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }

    .shop-grid {
      max-width: 1400px;
      margin: 120px auto 4rem;
      padding: 0 5%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .product-card:hover { transform: translateY(-6px); }
    .product-card img { width: 100%; height: 250px; object-fit: cover; }
    .product-info { padding: 1.5rem; text-align: center; }
    .price { font-size: 1.6rem; font-weight: 700; color: var(--accent); }

    /* Improved Smaller Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
    }
    .modal-header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .close {
      font-size: 2rem;
      cursor: pointer;
      width: 40px;
      text-align: center;
    }

    .modal-body { padding: 1.5rem; }
    label { display: block; margin: 1rem 0 0.5rem; font-weight: 600; }
    select, input, textarea { 
      width: 100%; 
      padding: 0.9rem; 
      border: 1px solid #ccc; 
      border-radius: 8px; 
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 1.1rem;
      margin-top: 1.5rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">HOME</a>
        <a href="services.html">SERVICES</a>
        <a href="shop.html" class="active">SHOP</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="shop-grid">
    <div class="product-card" onclick="openModal()">
      <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">
      <div class="product-info">
        <h3>DuckTrooper Figurine</h3>
        <div class="price">$45</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>DuckTrooper Figurine — $45</h2>
        <span class="close" onclick="closeModal()">×</span>
      </div>
      <div class="modal-body">
        <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" style="width:100%; border-radius:12px; margin-bottom:1rem;" alt="">

        <label>Duck Body Color</label>
        <select id="color">
          <option>Yellow</option>
          <option>White</option>
          <option>Black</option>
          <option>Orange</option>
          <option>Red</option>
          <option>Purple</option>
        </select>

        <label>Quantity</label>
        <input type="number" id="qty" value="1" min="1">

        <label>Notes / Shipping Info</label>
        <textarea id="notes" rows="3" placeholder="Any special requests..."></textarea>

        <button onclick="submitOrder()" class="btn">Submit Request & Pay with PayPal</button>
      </div>
    </div>
  </div>

  <script>
    function openModal() {
      document.getElementById('modal').style.display = "flex";
    }

    function closeModal() {
      document.getElementById('modal').style.display = "none";
    }

    function submitOrder() {
      const color = document.getElementById('color').value;
      const qty = document.getElementById('qty').value;
      
      alert(`Order Request:\nDuckTrooper Figurine\nColor: ${color}\nQuantity: ${qty}\n\nRedirecting to PayPal...`);
      window.open('https://paypal.me/MimsSolutions/45', '_blank');
      closeModal();
    }

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });
  </script>
</body>
</html>
