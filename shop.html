  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shop • Mims Solutions</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-light: #F8F9F6;
      --text-dark: #1F2521;
      --accent: #0D9488;
      --card-bg: #FFFFFF;
      --border: #E2E8E0;
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--bg-light); color: var(--text-dark); }

    header { position: fixed; top: 0; width: 100%; background: var(--accent); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }

    .shop-grid {
      max-width: 1400px;
      margin: 120px auto 4rem;
      padding: 0 5%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .product-card {
      background: white;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      cursor: pointer;
    }
    .product-card:hover { transform: translateY(-6px); }

    .product-card img { width: 100%; height: 240px; object-fit: cover; }
    .product-info { padding: 1.4rem; text-align: center; }
    .price { font-size: 1.6rem; font-weight: 700; color: var(--accent); margin: 0.5rem 0; }

    /* Smaller Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      z-index: 2000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: white;
      width: 90%;
      max-width: 460px;
      border-radius: var(--radius);
      max-height: 92vh;
      overflow-y: auto;
    }
    .modal-header { padding: 1.2rem 1.5rem; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
    .close { font-size: 1.8rem; cursor: pointer; }

    .modal-body { padding: 1.5rem; }
    label { display: block; margin: 1rem 0 0.4rem; font-weight: 600; }
    select, input, textarea { width: 100%; padding: 0.9rem; border: 1px solid #ddd; border-radius: 8px; }

    .btn {
      width: 100%;
      padding: 1.1rem;
      margin-top: 1.5rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">HOME</a>
        <a href="services.html">SERVICES</a>
        <a href="shop.html" class="active">SHOP</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="shop-grid">
    <div class="product-card" onclick="openProductModal()">
      <img src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" alt="DuckTrooper">
      <div class="product-info">
        <h3>DuckTrooper Figurine</h3>
        <div class="price">$45</div>
        <p style="color:#666; font-size:0.95rem;">Custom color available</p>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="productModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">DuckTrooper Figurine</h2>
        <span class="close" onclick="closeModal()">×</span>
      </div>
      <div class="modal-body">
        <img id="modalImage" src="https://i.etsystatic.com/56737607/r/il/07c110/6887518391/il_fullxfull.6887518391_8nyu.jpg" style="width:100%; border-radius:12px;" alt="">

        <form id="orderForm">
          <input type="hidden" id="productName" value="DuckTrooper Figurine">

          <label>Duck Body Color</label>
          <select id="color">
            <option value="Yellow">Yellow</option>
            <option value="White">White</option>
            <option value="Black">Black</option>
            <option value="Orange">Orange</option>
            <option value="Red">Red</option>
            <option value="Purple">Purple</option>
          </select>

          <label>Quantity</label>
          <input type="number" id="qty" value="1" min="1" style="width:100px;">

          <label>Special Requests / Shipping Notes</label>
          <textarea id="notes" rows="3" placeholder="Any special requests or shipping info..."></textarea>

          <button type="button" onclick="submitOrder()" class="btn">
            Submit Order Request & Pay with PayPal
          </button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function openProductModal() {
      document.getElementById('productModal').style.display = "flex";
    }

    function closeModal() {
      document.getElementById('productModal').style.display = "none";
    }

    function submitOrder() {
      const color = document.getElementById('color').value;
      const qty = document.getElementById('qty').value;
      const notes = document.getElementById('notes').value;

      const message = `New Order Request!\n\nProduct: DuckTrooper Figurine\nColor: ${color}\nQuantity: ${qty}\nNotes: ${notes || 'None'}`;

      alert("Order request received!\n\nYou will now be redirected to PayPal to complete payment.");

      // Open PayPal
      window.open('https://paypal.me/MimsSolutions/45', '_blank');

      // Optional: Try to send email (you'll need to set up Web3Forms)
      console.log(message);
      closeModal();
    }

    // Mobile menu script (add your existing one here)
  </script
