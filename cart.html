<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18035820566"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18035820566');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root { --accent: #0D9488; }
    body { font-family: 'Inter', sans-serif; background: #F8F9F6; color: #1F2521; padding-top: 90px; line-height: 1.6; }

    header { position: fixed; top: 0; width: 100%; background: var(--accent); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }

    .cart-container { max-width: 1000px; margin: 2rem auto; padding: 0 5%; }
    .cart-item {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
    }
    .totals { font-size: 1.1rem; margin: 1.5rem 0; }
    .total { font-size: 1.9rem; font-weight: 700; text-align: right; color: var(--accent); margin: 1rem 0; }

    label { display: block; margin: 1rem 0 0.3rem; font-weight: 600; }
    .required::after { content: " *"; color: red; }
    input, textarea, select { width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }

    .btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      cursor: pointer;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">HOME</a>
        <a href="services.html">SERVICES</a>
        <a href="shop.html">SHOP</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="cart-container">
    <h1>Your Cart</h1>
    <div id="cart-items"></div>

    <div class="totals" id="totals"></div>
    <div class="total" id="grand-total">Total: $0.00</div>

    <h2 style="margin-top: 3rem;">Shipping & Order Information</h2>

    <form id="checkoutForm" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="47582191-429a-495c-9f10-6b62f050a1e0">
      <input type="hidden" name="subject" value="New Order from Cart">
      <input type="hidden" name="cart_summary" id="cart_summary">
      <input type="hidden" name="grand_total" id="grand_total_input">

      <!-- Your form fields here (same as before) -->
      <label class="required">Full Name</label>
      <input type="text" name="name" required>

      <label>Company Name (optional)</label>
      <input type="text" name="company">

      <label class="required">Email Address</label>
      <input type="email" name="email" required>

      <label class="required">Phone Number</label>
      <input type="tel" name="phone" required>

      <label class="required">Street Address</label>
      <input type="text" name="street" required>

      <label>Apartment, Suite, Unit (optional)</label>
      <input type="text" name="apt">

      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem;">
        <div><label class="required">City</label><input type="text" name="city" required></div>
        <div><label class="required">State</label><input type="text" name="state" required></div>
        <div><label class="required">ZIP Code</label><input type="text" name="zip" required></div>
      </div>

      <label>Order Notes</label>
      <textarea name="notes" rows="4" placeholder="Gift message, delivery instructions..."></textarea>

      <button type="submit" class="btn">Submit Order & Pay with PayPal</button>
    </form>
  </div>

  <script>
    function loadCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cart-items');
      let subtotal = 0;
      let summary = "";

      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty.</p>';
        return;
      }

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        subtotal += itemTotal;
        summary += `${item.quantity}x ${item.name} (${item.color}) - $${itemTotal}\n`;

        container.innerHTML += `
          <div class="cart-item">
            <div><strong>${item.name}</strong><br>Color: ${item.color} × ${item.quantity}</div>
            <div style="text-align:right;">$${itemTotal}<br>
              <small onclick="removeFromCart(${index})" style="color:red; cursor:pointer;">Remove</small>
            </div>
          </div>`;
      });

      const tax = subtotal * 0.0625;
      const shipping = 7;
      const grandTotal = subtotal + tax + shipping;

      document.getElementById('totals').innerHTML = `
        Subtotal: $${subtotal.toFixed(2)}<br>
        Tax (6.25%): $${tax.toFixed(2)}<br>
        Shipping: $7.00
      `;
      document.getElementById('grand-total').textContent = `Grand Total: $${grandTotal.toFixed(2)}`;
      document.getElementById('cart_summary').value = summary;
      document.getElementById('grand_total_input').value = grandTotal.toFixed(2);
    }

    function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
    }

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });

    window.onload = loadCart;
  </script>
</body>
</html>
