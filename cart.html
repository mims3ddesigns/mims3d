  <meta charset="UTF-8" />

  <title>Your Cart • Mims Solutions</title>
 
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
 
  <style>
    :root { --accent: #0D9488; }
    body { font-family: 'Inter', sans-serif; background: #F8F9F6; color: #1F2521; line-height: 1.7; }
    header { position: fixed; top: 0; width: 100%; background: var(--accent); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }
    .nav-links { display: flex; gap: 2.5rem; }
    .nav-links a { color: #000; font-weight: 600; text-decoration: none; text-transform: uppercase; font-size: 0.95rem; letter-spacing: 1px; }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .cart-icon { font-size: 1.6rem; text-decoration: none; color: #000; }
    .menu-toggle { display: none; font-size: 2rem; cursor: pointer; color: #000; }
    main { padding-top: 250px; max-width: 1000px; margin: 0 auto; padding: 0 5% 6rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 7vw, 5rem); text-align: center; margin-bottom: 2rem; }
    .cart-item { background: white; padding: 1.5rem; border-radius: 12px; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .price-breakdown, .grand-total { background: white; padding: 2rem; border-radius: 16px; margin: 2rem 0; }
    .grand-total { font-size: 2rem; font-weight: 700; text-align: right; color: var(--accent); }
    form { background: white; padding: 2.5rem; border-radius: 16px; border: 1px solid #E2E8E0; }
    label { display: block; margin: 1.2rem 0 0.4rem; font-weight: 600; }
    .required::after { content: " *"; color: red; }
    input, textarea, select { width: 100%; padding: 1rem; border: 1px solid #ccc; border-radius: 8px; }
    button { width: 100%; padding: 1.3rem; background: var(--accent); color: #000; font-weight: 700; border: none; border-radius: 50px; margin-top: 2rem; cursor: pointer; }
    @media (max-width: 768px) {
      .nav-links { position: fixed; top:0; right:0; bottom:0; width:70%; background:#1a3c2e; flex-direction:column; justify-content:center; align-items:center; transform:translateX(100%); transition:transform 0.4s; z-index:999; }
      .nav-links.show { transform: translateX(0); }
      .menu-toggle { display: block; }
      main { padding-top: 130px; }
    }
  </style>

<body>
  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="../index.html">HOME</a>
        <a href="../services.html">SERVICES</a>
        <a href="../shop.html">SHOP</a>
        <a href="../about.html">ABOUT</a>
        <a href="../contact.html">CONTACT</a>
      </div>
      <a href="../cart.html" class="cart-icon">🛒 <span id="cart-count">0</span></a>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>
  <main>
    <h1>Your Cart</h1>
    <div id="cart-items"></div>
    <div class="price-breakdown" id="price-breakdown"></div>
    <div class="grand-total" id="grand-total">Grand Total: $0.00</div>
    
    <form id="checkoutForm" action="https://api.web3forms.com/submit" method="POST">
  <input type="hidden" name="access_key" value="47582191-429a-495c-9f10-6b62f050a1e0">
  <input type="hidden" name="subject" value="New Order from Cart - Mims Solutions">
  <input type="hidden" name="cart_summary" id="cart_summary">
  <input type="hidden" name="grand_total" id="grand_total_input">
  <input type="hidden" name="from_name" value="Mims Solutions Order">

      <label class="required">Full Name</label>
      <input type="text" name="name" required>
      <label>Company Name (optional)</label>
      <input type="text" name="company">
      <label class="required">Email Address</label>
      <input type="email" name="email" required>
      <label class="required">Phone Number</label>
      <input type="tel" name="phone" required>
      <label class="required">Street Address</label>
      <input type="text" name="street" required>
      <label>Apartment, Suite, Unit (optional)</label>
      <input type="text" name="apt">
      <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1rem;">
        <div><label class="required">City</label><input type="text" name="city" required></div>
        <div><label class="required">State</label><input type="text" name="state" required></div>
        <div><label class="required">ZIP Code</label><input type="text" name="zip" required></div>
      </div>
      <label>Order Notes (optional)</label>
      <textarea name="notes" rows="4"></textarea>
      <button type="submit">Submit Order & Pay with PayPal</button>
    </form>
  </main>

  <script>
    let grandTotal = 0;

    function loadCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cart-items');
      let subtotal = 0;
      let summary = "=== ORDER SUMMARY ===\n\n";

      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; font-size:1.3rem;">Your cart is empty.</p>';
        return;
      }

      cart.forEach((item, index) => {
        const itemTotal = item.price * (item.quantity || 1);
        subtotal += itemTotal;
        summary += `${item.quantity || 1}x ${item.name} (${item.mainColor || item.color || 'N/A'}) - $${itemTotal.toFixed(2)}\n`;

        container.innerHTML += `
          <div class="cart-item">
            <div><strong>${item.name}</strong><br>
            ${item.mainColor ? `Main Color: ${item.mainColor}<br>` : ''}
            ${item.letterColor ? `Letter Color: ${item.letterColor}<br>` : ''}
            ${item.personalization ? `Personalization: ${item.personalization}<br>` : ''}
            Qty: ${item.quantity || 1}
            </div>
            <div style="text-align:right;">
              $${itemTotal.toFixed(2)}<br>
              <small onclick="removeFromCart(${index})" style="color:red; cursor:pointer;">Remove</small>
            </div>
          </div>`;
      });

      const tax = subtotal * 0.0625;
      const shipping = 7;
      grandTotal = subtotal + tax + shipping;

      document.getElementById('price-breakdown').innerHTML = `
        <div>Subtotal: $${subtotal.toFixed(2)}</div>
        <div>Sales Tax (6.25%): $${tax.toFixed(2)}</div>
        <div>Shipping: $7.00</div>
      `;
      document.getElementById('grand-total').textContent = `Grand Total: $${grandTotal.toFixed(2)}`;
      document.getElementById('cart_summary').value = summary + `\n---\nSubtotal: $${subtotal.toFixed(2)}\nTax: $${tax.toFixed(2)}\nShipping: $7.00\nGRAND TOTAL: $${grandTotal.toFixed(2)}`;
      document.getElementById('grand_total_input').value = grandTotal.toFixed(2);
    }

    function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
    }

    // Submit form
    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
      e.preventDefault();
      fetch(this.action, { method: 'POST', body: new FormData(this) })
        .then(() => {
          window.open(`https://paypal.me/MimsSolutions/${grandTotal.toFixed(2)}`, '_blank');
          window.location.href = '../thanks-shop.html';
        })
        .catch(() => alert("Error submitting order. Please try again."));
    });

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });

    window.onload = loadCart;
  </script>
