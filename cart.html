<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18035820566"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'AW-18035820566');
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart • Mims Solutions</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --accent: #0D9488;
    }
    body { font-family: 'Inter', sans-serif; background: #F8F9F6; color: #1F2521; padding-top: 80px; }
    header { position: fixed; top: 0; width: 100%; background: var(--accent); z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    nav { max-width: 1400px; margin: 0 auto; padding: 1.2rem 5%; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-family: 'Playfair Display', serif; font-size: 2.25rem; font-weight: 700; color: #000; }

    .cart-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 5%;
    }
    .cart-item {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .total {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: right;
      margin: 2rem 0;
      color: var(--accent);
    }
    .btn {
      padding: 1.1rem 2.5rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <div class="logo">Mims Solutions</div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">HOME</a>
        <a href="services.html">SERVICES</a>
        <a href="shop.html">SHOP</a>
        <a href="about.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </div>
      <div class="menu-toggle" id="menuToggle">☰</div>
    </nav>
  </header>

  <div class="cart-container">
    <h1>Your Cart</h1>
    <div id="cart-items"></div>
    
    <div class="total" id="cart-total">$0.00</div>

    <button onclick="checkout()" class="btn" style="width:100%;">Proceed to PayPal Checkout</button>
    <p style="text-align:center; margin-top:1rem;">
      <a href="shop.html">← Continue Shopping</a>
    </p>
  </div>

  <script>
    function loadCart() {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      const container = document.getElementById('cart-items');
      let total = 0;

      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = '<p>Your cart is empty.</p>';
        return;
      }

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;

        container.innerHTML += `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong><br>
              Color: ${item.color} × ${item.quantity}
            </div>
            <div style="text-align:right;">
              $${itemTotal}<br>
              <small onclick="removeFromCart(${index})" style="color:red; cursor:pointer;">Remove</small>
            </div>
          </div>`;
      });

      document.getElementById('cart-total').textContent = `Total: $${total} + $7 Shipping`;
    }

    function removeFromCart(index) {
      let cart = JSON.parse(localStorage.getItem('cart')) || [];
      cart.splice(index, 1);
      localStorage.setItem('cart', JSON.stringify(cart));
      loadCart();
    }

    function checkout() {
      const total = document.getElementById('cart-total').textContent;
      if (confirm(`Proceed to PayPal for ${total}?`)) {
        window.location.href = "https://paypal.me/MimsSolutions/15";  // $8 + $7
      }
    }

    // Mobile Menu
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
      menuToggle.textContent = navLinks.classList.contains('show') ? '✕' : '☰';
    });

    window.onload = loadCart;
  </script>
</body>
</html>
